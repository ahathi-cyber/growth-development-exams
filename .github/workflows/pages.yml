name: Deploy practice site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate and normalize bundled question bank
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const source = fs.readFileSync('questions.js', 'utf8');
          const match = source.match(/"([^"]+)"/);
          if (!match) throw new Error('Missing compressed question bank');
          const compressed = Buffer.from(match[1], 'base64');
          const json = zlib.inflateRawSync(compressed.subarray(10, compressed.length - 8)).toString('utf8');
          const bank = JSON.parse(json);
          if (bank.tf.length !== 30 || bank.sba.length !== 30) throw new Error('Expected 30 T/F groups and 30 SBA questions');
          const canonical = zlib.gzipSync(Buffer.from(JSON.stringify(bank), 'utf8')).toString('base64');
          fs.writeFileSync('questions.js', 'window.QUESTION_BANK_GZIP_B64 = "' + canonical + '";\n');
          console.log('Validated and normalized', bank.tf.length, 'T/F groups and', bank.sba.length, 'SBA questions.');
          NODE
      - name: Validate schizophrenia practice bank
        run: |
          node - <<'NODE'
          global.window = {};
          require('./schizophrenia.js');
          const bank = global.window.SCHIZOPHRENIA_BANK;
          if (!bank || bank.tf.length !== 30 || bank.sba.length !== 30 || bank.essays.length !== 3) {
            throw new Error('Schizophrenia bank must contain 30 T/F groups, 30 SBA questions and 3 essays.');
          }
          for (const [i, essay] of bank.essays.entries()) {
            const total = essay.rubric.reduce((sum, criterion) => sum + criterion.points, 0);
            if (essay.max !== 20 || total !== 20) throw new Error('Essay ' + (i + 1) + ' rubric must total exactly 20 marks; got ' + total);
          }
          if (!Array.isArray(bank.essays) || bank.essays.length !== 3) throw new Error('Child Psychiatry bank must contain exactly 3 essays.');
          for (const [i, essay] of bank.essays.entries()) { const total = essay.rubric.reduce((sum, criterion) => sum + criterion.points, 0); if (essay.max !== 20 || total !== 20) throw new Error('Schizophrenia essay ' + (i + 1) + ' rubric must total 20 marks; got ' + total); }
          for (const [i, group] of bank.tf.entries()) {
            if (!Array.isArray(group.statements) || group.statements.length !== 5) throw new Error('T/F group ' + (i + 1) + ' must have five statements.');
          }
          for (const [i, q] of bank.sba.entries()) {
            if (!q.options || Object.keys(q.options).length !== 5 || !q.options[q.answer]) throw new Error('SBA question ' + (i + 1) + ' must have five options and a valid answer key.');
          }
          console.log('Validated schizophrenia: 30 T/F groups, 30 SBA questions, 3 essay rubrics of 20 marks each.');
          NODE
      - name: Syntax-check scripts and validate every practice bank
        run: |
          set -e
          node --check app.js
          node --check child-psychiatry.js
          node --check child-psychiatry-essays.js
          node --check student-history.js
          node --check schizophrenia.js
          node --check neonatal-jaundice.js
          node --check delusional-disorder.js
          node --check delusional-disorder-extra.js
          node - <<'NODE'
          global.window = {};
          require('./child-psychiatry.js');
          require('./child-psychiatry-essays.js');
          require('./delusional-disorder.js');
          require('./delusional-disorder-extra.js');
          const psychiatry01 = global.window.DELUSIONAL_DISORDER_BANK;
          if (!psychiatry01 || psychiatry01.tf.length !== 30 || psychiatry01.sba.length !== 30 || psychiatry01.essays.length !== 3) {
            throw new Error('Psychiatry Test 01 must contain 30 T/F groups, 30 SBA questions and 3 essays.');
          }
          for (const [i, group] of psychiatry01.tf.entries()) {
            if (!Array.isArray(group.statements) || group.statements.length !== 5) throw new Error('Psychiatry Test 01 T/F group ' + (i + 1) + ' must have five statements.');
            for (const [j, item] of group.statements.entries()) {
              if (!Array.isArray(item) || item.length < 2 || typeof item[0] !== 'string' || typeof item[1] !== 'boolean') throw new Error('Invalid Psychiatry Test 01 T/F statement at group ' + (i + 1) + ', item ' + (j + 1));
            }
          }
          for (const [i, q] of psychiatry01.sba.entries()) {
            if (!q.stem || !q.options || Object.keys(q.options).length !== 5 || !q.options[q.answer]) throw new Error('Psychiatry Test 01 SBA question ' + (i + 1) + ' must have a stem, five options and a valid answer key.');
          }
          for (const [i, essay] of psychiatry01.essays.entries()) {
            const total = essay.rubric.reduce((sum, criterion) => sum + criterion.points, 0);
            if (essay.max !== 20 || total !== 20) throw new Error('Psychiatry Test 01 essay ' + (i + 1) + ' rubric must total 20 marks; got ' + total);
          }
          const bank = global.window.CHILD_PSYCHIATRY_BANK;
          if (!bank || bank.tf.length !== 30 || bank.sba.length !== 32 || !Array.isArray(bank.essays) || bank.essays.length !== 3) {
            throw new Error('Child Psychiatry bank must contain 30 T/F groups and 32 SBA questions; got ' +
              (bank?.tf?.length ?? 'missing') + ' and ' + (bank?.sba?.length ?? 'missing'));
          }
          for (const [i, essay] of bank.essays.entries()) { const total = essay.rubric.reduce((sum, criterion) => sum + criterion.points, 0); if (essay.max !== 20 || total !== 20) throw new Error('Child Psychiatry essay ' + (i + 1) + ' rubric must total 20 marks; got ' + total); }
          for (const [i, group] of bank.tf.entries()) {
            if (!Array.isArray(group.statements) || group.statements.length !== 5) throw new Error('Child Psychiatry T/F group ' + (i + 1) + ' must have five statements.');
            for (const [j, item] of group.statements.entries()) {
              if (!Array.isArray(item) || item.length < 2 || typeof item[0] !== 'string' || typeof item[1] !== 'boolean') throw new Error('Invalid T/F statement at group ' + (i + 1) + ', item ' + (j + 1));
            }
          }
          for (const [i, q] of bank.sba.entries()) {
            if (!q.stem || !q.options || Object.keys(q.options).length !== 5 || !q.options[q.answer]) throw new Error('SBA question ' + (i + 1) + ' must have a stem, five options and a valid answer key.');
          }
          const html = require('fs').readFileSync('index.html', 'utf8');
          const history = require('fs').readFileSync('student-history.js', 'utf8');
          const app = require('fs').readFileSync('app.js', 'utf8');
          for (const id of ['signin','home','student-id','student-save','student-status','student-history-list']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing registration/history element: ' + id);
          }
          if (!history.includes("localStorage.setItem(ID_KEY,id)") || !history.includes("continueToQuizzes();") || !history.includes("signin.classList.add('hidden')") || !history.includes("home.classList.remove('hidden')")) throw new Error('Student registration must save the ID, hide sign-in and continue to the topic dashboard.');
          if (!app.includes("if(typeof saveQuizAttempt==='function')saveQuizAttempt(")) throw new Error('Quiz submission must save attempt history.');
          console.log('PASS: JS syntax, 30 Child Psychiatry T/F groups, 32 keyed SBA questions, registration continuation and history hook.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy practice site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate and normalize bundled question bank
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const source = fs.readFileSync('questions.js', 'utf8');
          const match = source.match(/"([^"]+)"/);
          if (!match) throw new Error('Missing compressed question bank');
          const compressed = Buffer.from(match[1], 'base64');
          const json = zlib.inflateRawSync(compressed.subarray(10, compressed.length - 8)).toString('utf8');
          const bank = JSON.parse(json);
          if (bank.tf.length !== 30 || bank.sba.length !== 30) throw new Error('Expected 30 T/F groups and 30 SBA questions');
          const canonical = zlib.gzipSync(Buffer.from(JSON.stringify(bank), 'utf8')).toString('base64');
          fs.writeFileSync('questions.js', 'window.QUESTION_BANK_GZIP_B64 = "' + canonical + '";\n');
          console.log('Validated and normalized', bank.tf.length, 'T/F groups and', bank.sba.length, 'SBA questions.');
          NODE
      - name: Validate source-only schizophrenia bank
        run: |
          node --check schizophrenia.js
          node - <<'NODE'
          global.window = {};
          require('./schizophrenia.js');
          const bank = global.window.SCHIZOPHRENIA_BANK;
          if (!bank || !Array.isArray(bank.tf) || !Array.isArray(bank.sba) || !Array.isArray(bank.essays)) {
            throw new Error('Schizophrenia bank must expose T/F, SBA and essay arrays.');
          }
          console.log('PASS: schizophrenia bank schema valid; no minimum question count required.');
          NODE
      - name: Syntax-check scripts and validate source-only banks
        run: |
          set -e
          node --check app.js
          node --check child-psychiatry.js
          node --check child-psychiatry-essays.js
          node --check student-history.js
          node --check schizophrenia.js
          node --check neonatal-jaundice.js
          node --check bipolar-affective.js
          node - <<'NODE'
          global.window = {};
          require('./child-psychiatry.js');
          require('./child-psychiatry-essays.js');
          require('./bipolar-affective.js');
          require('./schizophrenia.js');
          for (const [name, bank] of [
            ['Child Psychiatry', global.window.CHILD_PSYCHIATRY_BANK],
            ['Bipolar Affective Disorder', global.window.BIPOLAR_AFFECTIVE_BANK],
            ['Schizophrenia', global.window.SCHIZOPHRENIA_BANK]
          ]) {
            if (!bank || !Array.isArray(bank.tf) || !Array.isArray(bank.sba) || !Array.isArray(bank.essays)) {
              throw new Error(name + ': expected T/F, SBA and essay arrays.');
            }
          }
          const html = require('fs').readFileSync('index.html', 'utf8');
          const history = require('fs').readFileSync('student-history.js', 'utf8');
          const app = require('fs').readFileSync('app.js', 'utf8');
          for (const id of ['signin','home','student-id','student-save','student-status','student-history-list']) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing registration/history element: ' + id);
          }
          if (!history.includes("localStorage.setItem(ID_KEY,id)") || !history.includes("continueToQuizzes();") || !history.includes("signin.classList.add('hidden')") || !history.includes("home.classList.remove('hidden')")) throw new Error('Student registration flow validation failed.');
          if (!app.includes("if(typeof saveQuizAttempt==='function')saveQuizAttempt(")) throw new Error('Quiz submission history hook missing.');
          console.log('PASS: script syntax, student registration/history and source-only legacy bank schemas.');
          NODE
      - name: Validate source-only psychiatry modules
        run: |
          node --check psychiatry-modules.js
          node --check app.js
          node - <<'NODE'
          global.window = {};
          require('./psychiatry-modules.js');
          const banks = global.window.PSYCHIATRY_MODULE_BANKS;
          if (!banks || Object.keys(banks).length !== 16) throw new Error('Expected 16 ordered psychiatry modules.');
          for (const [id, bank] of Object.entries(banks)) {
            if (!bank.label || !Array.isArray(bank.tf) || !Array.isArray(bank.sba) || !Array.isArray(bank.essays)) {
              throw new Error(id + ': invalid source-only bank structure.');
            }
            for (const group of bank.tf) {
              if (!Array.isArray(group.statements)) throw new Error(id + ': invalid T/F group.');
              for (const item of group.statements) if (!Array.isArray(item) || typeof item[0] !== 'string' || typeof item[1] !== 'boolean') throw new Error(id + ': invalid T/F statement.');
            }
            for (const q of bank.sba) if (!q.stem || !q.options || !q.answer || !q.options[q.answer]) throw new Error(id + ': invalid SBA item.');
          }
          const html = require('fs').readFileSync('index.html', 'utf8');
          for (const id of Object.keys(banks)) if (!html.includes('data-topic="' + id + '"')) throw new Error('Missing dashboard card for ' + id);
          console.log('PASS: 16 psychiatry modules; question counts may reflect only verified uploaded past-paper items.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
